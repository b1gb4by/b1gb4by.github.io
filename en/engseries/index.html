</a><script type=module>
  
  const mermaidNodes = document.querySelectorAll('.mermaid');
  if (mermaidNodes.length) {
    async function loadMermaid() {
      const urls = [
        'https://cdn.jsdelivr.net/npm/mermaid@11.16.1/dist/mermaid.esm.min.mjs',
        'https://unpkg.com/mermaid@11.16.1/dist/mermaid.esm.min.mjs',
      ];
      let lastError;
      for (const url of urls) {
        try {
          return (await import(url)).default;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError;
    }

    const mermaid = await loadMermaid();

    
    
    const isDark = () => {
      const theme = document.documentElement.dataset.theme;
      if (theme === 'dark') return true;
      if (theme === 'light') return false;
      return window.matchMedia('(prefers-color-scheme: dark)').matches;
    };

    const gitColors = {
      git0: '#7E9CD8', git1: '#E6C384', git2: '#98BB6C', git3: '#957FB8',
      git4: '#7FB4CA', git5: '#D27E99', git6: '#FFA066', git7: '#7AA89F',
    };

    const getTheme = () => {
      if (isDark()) {
        return {
          theme: 'dark',
          themeVariables: {
            ...gitColors,
            darkMode: true,
            background: '#1F1F28', primaryColor: '#7E9CD8', primaryTextColor: '#DCD7BA',
            primaryBorderColor: '#6b8abb', secondaryColor: '#E6C384', tertiaryColor: '#98BB6C',
            textColor: '#DCD7BA', lineColor: '#DCD7BA', mainBkg: '#2A2A37',
            noteBkgColor: '#2A2A37', noteTextColor: '#DCD7BA', noteBorderColor: '#54546D',
            nodeBorder: '#7E9CD8', clusterBkg: '#2A2A37', clusterBorder: '#54546D',
            defaultLinkColor: '#DCD7BA', edgeLabelBackground: '#1F1F28',
            cScale0: '#7E9CD8', cScale1: '#E6C384', cScale2: '#98BB6C', cScale3: '#957FB8',
            cScale4: '#D27E99', cScale5: '#7FB4CA', cScale6: '#FFA066', cScale7: '#7AA89F',
            cScaleLabel0: '#1F1F28', cScaleLabel1: '#1F1F28', cScaleLabel2: '#1F1F28', cScaleLabel3: '#1F1F28',
            cScaleLabel4: '#1F1F28', cScaleLabel5: '#1F1F28', cScaleLabel6: '#1F1F28', cScaleLabel7: '#1F1F28',
            sectionBkgColor: '#2A2A37', altSectionBkgColor: '#1F1F28', sectionBkgColor2: '#363646',
            taskBorderColor: '#7E9CD8', taskBkgColor: '#7E9CD8',
            activeTaskBorderColor: '#E6C384', activeTaskBkgColor: '#E6C384',
            gridColor: '#54546D', doneTaskBkgColor: '#98BB6C', doneTaskBorderColor: '#76946A',
            critBorderColor: '#E46876', critBkgColor: '#E46876', todayLineColor: '#D27E99',
            taskTextColor: '#1F1F28', taskTextOutsideColor: '#DCD7BA', taskTextDarkColor: '#1F1F28',
            labelColor: '#DCD7BA', errorBkgColor: '#43242B', errorTextColor: '#DCD7BA',
          }
        };
      }
      return {
        theme: 'base',
        themeVariables: {
          ...gitColors,
          darkMode: false,
          cScale0: '#c4d4ef', cScale1: '#f0ddb8', cScale2: '#c8d9b2', cScale3: '#c7bdd9',
          cScale4: '#e8b9c8', cScale5: '#bdd7e3', cScale6: '#ffd0b0', cScale7: '#bad1cc',
          cScaleLabel0: '#000000', cScaleLabel1: '#000000', cScaleLabel2: '#000000', cScaleLabel3: '#000000',
          cScaleLabel4: '#000000', cScaleLabel5: '#000000', cScaleLabel6: '#000000', cScaleLabel7: '#000000',
          background: '#ffffff', primaryColor: '#7E9CD8', primaryTextColor: '#000000',
          primaryBorderColor: '#6b8abb', secondaryColor: '#E6C384', tertiaryColor: '#98BB6C',
          textColor: '#000000', lineColor: '#000000', mainBkg: '#ffffff',
          noteBkgColor: '#f5f5f5', noteTextColor: '#000000', noteBorderColor: '#E6C384',
          nodeBorder: '#7E9CD8', clusterBkg: '#f5f5f5', clusterBorder: '#000000',
          defaultLinkColor: '#000000', edgeLabelBackground: '#ffffff',
          sectionBkgColor: '#f5f5f5', altSectionBkgColor: '#ffffff', sectionBkgColor2: '#eeeeee',
          taskBorderColor: '#7E9CD8', taskBkgColor: '#7E9CD8',
          activeTaskBorderColor: '#E6C384', activeTaskBkgColor: '#E6C384',
          gridColor: '#cccccc', doneTaskBkgColor: '#98BB6C', doneTaskBorderColor: '#76946A',
          critBorderColor: '#E46876', critBkgColor: '#E46876', todayLineColor: '#D27E99',
          taskTextColor: '#000000', taskTextOutsideColor: '#000000', taskTextDarkColor: '#000000',
          labelColor: '#000000', errorBkgColor: '#fce4e4', errorTextColor: '#E46876',
        }
      };
    };

    
    mermaid.initialize({
      startOnLoad: false,
      ...getTheme(),
      securityLevel: 'loose',
    });
    await mermaid.run({ querySelector: '.mermaid' });

    
    new MutationObserver(() => location.reload()).observe(
      document.documentElement,
      { attributes: true, attributeFilter: ['data-theme'] }
    );

    window.expandMermaid = function (id) {
      const svg = document.getElementById(id)?.querySelector('svg');
      if (!svg) return;

      document.getElementById('mermaid-modal')?.remove();

      const modal = document.createElement('div');
      modal.id = 'mermaid-modal';
      modal.className = 'mermaid-modal';

      const content = document.createElement('div');
      content.className = 'mermaid-modal-content';

      const close = document.createElement('button');
      close.type = 'button';
      close.className = 'mermaid-modal-close';
      close.textContent = '\u00d7';
      close.setAttribute('aria-label', 'Close');

      const svgClone = svg.cloneNode(true);
      svgClone.style.cssText = 'max-width:90vw;max-height:90vh;width:auto;height:auto';

      content.append(close, svgClone);
      modal.appendChild(content);
      document.body.appendChild(modal);

      const dismiss = () => { modal.remove(); document.removeEventListener('keydown', onKey); };
      const onKey = (e) => { if (e.key === 'Escape') dismiss(); };
      modal.addEventListener('click', (e) => { if (e.target === modal) dismiss(); });
      close.addEventListener('click', dismiss);
      document.addEventListener('keydown', onKey);
    };
  }

  
  const chartCanvases = document.querySelectorAll('canvas.chartjs-canvas');
  if (chartCanvases.length) {
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.async = true;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error(`Failed to load ${src}`));
        document.head.appendChild(s);
      });
    }

    async function loadChart() {
      if (window.Chart) return window.Chart;
      const urls = [
        'https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js',
        'https://unpkg.com/chart.js@4.5.1/dist/chart.umd.min.js',
      ];
      let lastError;
      for (const url of urls) {
        try {
          await loadScript(url);
          if (window.Chart) return window.Chart;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error('Chart.js failed to load');
    }

    const Chart = await loadChart();
    const chartIsDark = () => {
      const theme = document.documentElement.dataset.theme;
      if (theme === 'dark') return true;
      if (theme === 'light') return false;
      return window.matchMedia('(prefers-color-scheme: dark)').matches;
    };

    const textColor = chartIsDark() ? '#DCD7BA' : '#1F1F28';
    const gridColor = chartIsDark() ? '#54546D' : '#cccccc';
    const palette = ['#7E9CD8', '#E6C384', '#98BB6C', '#957FB8', '#D27E99', '#7FB4CA', '#FFA066', '#7AA89F'];

    for (const canvas of chartCanvases) {
      let parsed;
      try {
        const encoded = canvas.dataset.chartConfig || '';
        const json = encoded
          ? new TextDecoder().decode(Uint8Array.from(atob(encoded), (c) => c.charCodeAt(0)))
          : '{}';
        parsed = JSON.parse(json);
        if (typeof parsed === 'string') parsed = JSON.parse(parsed);
      } catch (err) {
        console.error('Invalid Chart.js JSON for', canvas.id, err);
        continue;
      }

      const type = parsed.type || canvas.dataset.chartType || 'pie';
      const data = parsed.data || parsed;
      const userOptions = parsed.options || {};

      if (Array.isArray(data.datasets)) {
        data.datasets = data.datasets.map((ds, i) => {
          const next = { ...ds };
          if (!next.backgroundColor) {
            next.backgroundColor = Array.isArray(next.data)
              ? next.data.map((_, j) => palette[j % palette.length])
              : palette[i % palette.length];
          }
          if (!next.borderColor) {
            next.borderColor = chartIsDark() ? '#1F1F28' : '#ffffff';
          }
          if (next.borderWidth == null) next.borderWidth = 2;
          return next;
        });
      }

      const baseOptions = {
        responsive: true,
        maintainAspectRatio: false,
        color: textColor,
        plugins: {
          legend: { labels: { color: textColor } },
        },
      };
      if (!['pie', 'doughnut', 'polarArea'].includes(type)) {
        baseOptions.scales = {
          x: { ticks: { color: textColor }, grid: { color: gridColor } },
          y: { ticks: { color: textColor }, grid: { color: gridColor } },
        };
      }

      new Chart(canvas, {
        type,
        data,
        options: {
          ...baseOptions,
          ...userOptions,
          plugins: {
            ...baseOptions.plugins,
            ...(userOptions.plugins || {}),
            legend: {
              ...baseOptions.plugins.legend,
              ...((userOptions.plugins && userOptions.plugins.legend) || {}),
            },
          },
        },
      });
    }
  }
